<!DOCTYPE html>
<html lang="hy">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>THOR Security</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
}

/* Главный экран */

.hero {

    height: 40vh;

    background-image: linear-gradient(
        rgba(0,0,0,0.6),
        rgba(0,0,0,0.6)
    ),
    url("thor-bg.jpg");

    background-size: cover;
    background-position: center;

    color:rgb(14, 13, 13);
    text-align:center;

}


/* Логотип */

.logo {

    position:absolute;

    top:30px;
    left:40px;

    width:150px;

}


/* Заголовок */

.hero-content {

    position: absolute;

    bottom: 40px;

    left: 50%;

    transform: translateX(-50%);

    width: 90%;

    text-align: center;

}


.hero h1 {

    font-size:55px;

}


.hero h2 {

    font-size:30px;

    margin-top:20px;

}


.hero p {

    font-size:22px;

    margin-top:30px;

}


.button {

    display:inline-block;

    margin-top:40px;

    padding:15px 35px;

    background:#e9ebee;

    color:rgb(15, 15, 15);

    text-decoration:none;

    border-radius:5px;

}
nav {

    position:absolute;

    top:40px;

    right:40px;

}


nav a {

    color:rgb(243, 242, 242);

    text-decoration:none;

    margin-left:25px;

    font-size:16px;

}


nav a:hover {

    color:#0c0c0c;

}

</style>

</head>


<body>


<section class="hero">


<img class="logo" src="IMG_8160.png">
<nav>

<a href="#">Գլխավոր</a>

<a href="#">Մեր մասին</a>

<a href="#">Ծառայություններ</a>

<a href="#">Առավելություններ</a>

<a href="#">Նկարադարան</a>

<a href="#">Հետադարձ կապ</a>

</nav>


<div class="hero-content">


<h1>THOR Security</h1>


<h2>
Ձեզ պաշտպանող Հզոր ուժ
</h2>


<p>
THOR համակարգը պաշտպանում է Ձեզ, Ձեր բիզնեսը և Ձեր բնակարանը։
</p>


<a class="button" href="#">
Կապվել մեզ հետ
</a>


</div>


</section>




</body>

</html>
